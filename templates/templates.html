{% extends 'base.html' %}{% block title %}Templates · NEWDS{% endblock %}{% block content %}<section class="mx-auto max-w-5xl"><div class="mb-8"><p class="text-[11px] uppercase tracking-[.25em] text-violet">Start with a shape</p><h1 class="mt-1 font-serif text-4xl">Templates</h1></div><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">{% for item in templates %}<a href="{{ url_for('new_note',template=item.id) }}" class="glass rounded-2xl p-5 hover:border-violet/40"><span class="text-[10px] uppercase tracking-[.2em] text-rose">{{ item.mood }}</span><h2 class="mt-2 font-serif text-2xl">{{ item.name }}</h2><p class="mt-3 text-xs text-white/40">Buka template ini dan mulai menulis.</p></a>{% endfor %}</div></section>{% endblock %}
